<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10연속 연산 도전</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#20324d;background:#f4f7ff}*{box-sizing:border-box}body{margin:0;padding:18px}.game{max-width:620px;margin:0 auto;background:white;border-radius:24px;padding:24px;box-shadow:0 8px 30px #263d6a18}h1{text-align:center;margin:4px 0 7px;font-size:clamp(24px,5vw,34px)}.sub{text-align:center;color:#73819a;margin:0 0 24px}.settings{display:grid;gap:12px}label{font-size:14px;font-weight:700;display:block;margin:0 0 7px}.options{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#eff3fa;border:2px solid transparent;color:#314362;border-radius:12px;padding:10px 13px;font-size:15px;font-weight:700;cursor:pointer}.pill.active{background:#e5efff;border-color:#377fe4;color:#1761be}.primary{width:100%;border:0;background:#2d72e2;color:white;border-radius:14px;padding:15px;font-size:18px;font-weight:800;cursor:pointer}.ghost{background:#eff3fa;color:#25436c}.hidden{display:none!important}.info{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:750;margin-bottom:13px}.track{height:12px;background:#e9eff9;border-radius:99px;overflow:hidden}.progress{height:100%;width:0%;background:#42ad8b;transition:width .15s}.clockline{display:flex;align-items:center;gap:10px;margin:18px 0 3px}.clocktrack{height:13px;flex:1;border-radius:99px;background:#e9eff9;overflow:hidden}.clockfill{height:100%;width:100%;background:#3b82f6;transform-origin:left}.clock{font-weight:900;color:#226ce2;font-size:22px;width:62px;text-align:right}.problem{background:#f1f6ff;border-radius:20px;text-align:center;padding:28px 10px;margin:18px 0 16px;font-size:clamp(42px,9vw,67px);font-weight:900;letter-spacing:2px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.answer{border:2px solid #cbd9ef;background:white;color:#20324d;border-radius:16px;padding:22px 0;font-size:31px;font-weight:900;cursor:pointer}.answer:active{transform:scale(.96)}.answer:disabled{opacity:.5}.feedback{min-height:55px;font-size:17px;font-weight:800;text-align:center;padding:12px}.center{text-align:center}.big{font-size:56px;margin:12px}.result{padding:20px 0}.small{font-size:13px;color:#8390a3;margin-top:12px;text-align:center}.row{display:flex;gap:8px}.row button{flex:1}.topbtn{background:none;color:#567399;border:0;cursor:pointer;font-size:13px;font-weight:700}.warn{color:#e65753}.good{color:#138a62}@media(max-width:400px){.game{padding:17px}.pill{padding:9px 10px;font-size:14px}.answer{padding:18px 0}}
</style></head><body><main class="game"><h1>🌟 10연속 연산 도전</h1><p class="sub">받아올림 덧셈 · 받아내림 뺄셈</p><section id="setup" class="settings"><div><label>연산 종류</label><div id="modes" class="options"><button class="pill active" data-mode="mix">섞어서</button><button class="pill" data-mode="add">덧셈</button><button class="pill" data-mode="sub">뺄셈</button></div></div><div><label>문제당 제한 시간</label><div id="times" class="options"><button class="pill" data-time="2">2초 ⚡</button><button class="pill" data-time="3">3초</button><button class="pill active" data-time="5">5초</button><button class="pill" data-time="10">10초</button><button class="pill" data-time="0">제한 없음</button></div></div><div><label>게임 규칙</label><p style="font-size:14px;color:#63728c;line-height:1.6;margin:0">10문제를 연속으로 맞히면 성공! 틀리거나 시간이 지나면 도전이 끝나요. 새 문제로 다시 시작할 수 있어요.</p></div><button id="start" class="primary">도전 시작! 🚀</button></section><section id="playing" class="hidden"><div class="info"><span id="count">1 / 10문제</span><span>⭐ 연속 정답 <span id="streak">0</span></span></div><div class="track"><div class="progress" id="progress"></div></div><div class="clockline"><span>⏱️</span><div class="clocktrack"><div id="clockfill" class="clockfill"></div></div><div id="clock" class="clock">5.0</div></div><div id="problem" class="problem">8 + 5 = ?</div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="row"><button class="topbtn" id="quit">⟵ 설정으로 돌아가기</button></div></section><section id="result" class="hidden center result"><div id="emoji" class="big">🏆</div><h2 id="result-title">클리어!</h2><p id="result-text"></p><div class="row"><button id="retry" class="primary">같은 설정으로 다시</button><button id="change" class="primary ghost">시간 바꾸기</button></div></section><p class="small">한 자리 수 받아올림 덧셈 · 20 미만 받아내림 뺄셈</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let mode='mix',seconds=5,streak=0,round=0,deadline=0,tick=null,locked=false,current=null,used=new Set();const sections=['setup','playing','result'];function show(section){sections.forEach(id=>$(id).classList.toggle('hidden',id!==section))}function choose(group,attr,val){document.querySelectorAll('#'+group+' .pill').forEach(b=>b.classList.toggle('active',b.dataset[attr]===String(val)))}$('modes').onclick=e=>{let b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;choose('modes','mode',mode)}};$('times').onclick=e=>{let b=e.target.closest('[data-time]');if(b){seconds=+b.dataset.time;choose('times','time',seconds)}};function randint(a,b){return a+Math.floor(Math.random()*(b-a+1))}function generate(){let p,k;do{const op=mode==='mix'?(Math.random()<.5?'+':'−'):mode==='add'?'+':'−';if(op==='+'){let a=randint(2,9),b=randint(Math.max(2,10-a),9);p={a,b,op,correct:a+b}}else{let a=randint(11,18),ones=a%10,b=randint(ones+1,9);p={a,b,op,correct:a-b}}k=p.a+p.op+p.b}while(used.has(k)&&used.size<50);used.add(k);return p}function choices(n){let candidates=[n];while(candidates.length<3){let v=n+randint(-4,4);if(v>=0&&v<=20&&!candidates.includes(v))candidates.push(v)}return candidates.sort(()=>Math.random()-.5)}function clearClock(){if(tick!==null){cancelAnimationFrame(tick);tick=null}}function updateClock(){if(locked)return;if(!seconds){$('clock').textContent='∞';$('clockfill').style.width='100%';return}let remaining=Math.max(0,(deadline-performance.now())/1000);$('clock').textContent=remaining.toFixed(1);$('clockfill').style.width=(remaining/seconds*100)+'%';$('clockfill').style.background=remaining<=1?'#ef5c58':'#3b82f6';if(remaining<=0){finish(false,'시간 초과! ⏰');return}tick=requestAnimationFrame(updateClock)}function startQuestion(){locked=false;current=generate();$('count').textContent=(round+1)+' / 10문제';$('streak').textContent=streak;$('progress').style.width=round*10+'%';$('problem').textContent=`${current.a} ${current.op} ${current.b} = ?`;$('feedback').textContent='';$('answers').replaceChildren();choices(current.correct).forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answer(v);$('answers').append(b)});deadline=performance.now()+seconds*1000;clearClock();updateClock()}function answer(v){if(locked)return;if(seconds&&performance.now()>=deadline){finish(false,'시간 초과! ⏰');return}if(v!==current.correct){finish(false,`아쉬워요! 정답은 ${current.correct}이에요.`);return}locked=true;clearClock();streak++;$('streak').textContent=streak;$('progress').style.width=streak*10+'%';$('feedback').textContent='정답! 🎉';$('feedback').className='feedback good';Array.from($('answers').children).forEach(b=>{b.disabled=true;if(+b.textContent===v){b.style.background='#def9ed';b.style.borderColor='#25aa77'}});if(streak===10){setTimeout(()=>{if(locked)finish(true,'')},550)}else{setTimeout(()=>{if(locked){round++;startQuestion()}},550)}}function finish(win,msg){if(locked&&!(win&&streak===10))return;locked=true;clearClock();$('emoji').textContent=win?'🏆':'💪';$('result-title').textContent=win?'10연속 성공!':'다시 도전해요!';$('result-text').textContent=win?`10문제를 모두 맞혔어요! (${seconds?seconds+'초':'시간 무제한'} 모드)`:`${msg} 이번에는 ${streak}문제 연속 정답!`;show('result')}function begin(){clearClock();used=new Set();streak=0;round=0;show('playing');startQuestion()}$('start').onclick=begin;$('retry').onclick=begin;$('change').onclick=()=>{clearClock();locked=true;show('setup')};$('quit').onclick=()=>{clearClock();locked=true;show('setup')};window.addEventListener('pagehide',clearClock);})();
</script></body></html>
